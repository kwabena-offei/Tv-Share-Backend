default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: postgres
  host: 127.0.0.1  # Changed from localhost to explicit IPv4
  port: 5432

development:
  <<: *default
  database: tvsharedb_development

test:
  <<: *default
  database: tvsharedb_test

production:
  <<: *default
  database: tvsharedb_production
