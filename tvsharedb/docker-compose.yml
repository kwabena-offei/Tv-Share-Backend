version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@db:5432/tvsharedb_development
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY_BASE=dummy_key_for_development
      - OPEN_AI_ORGANIZATION_ID=change_me
      - OPEN_AI_API_KEY=change_me
    depends_on:
      - db
      - redis
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=tvsharedb_development
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

volumes:
  postgres_data: 