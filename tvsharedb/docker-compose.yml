version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - RAILS_ENV=development
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/tvsharedb_development
      - SECRET_KEY_BASE=dummy_key_for_development
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=tvsharedb_development
    ports:
      - "5432:5432"

volumes:
  postgres_data: 